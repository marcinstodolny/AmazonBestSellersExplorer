name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend projects
        run: |
          dotnet restore src/API/AmazonBestSellersExplorer.API/AmazonBestSellersExplorer.API.csproj
          dotnet restore test/Unit/AmazonBestSellersExplorer.UnitTests/AmazonBestSellersExplorer.UnitTests.csproj
          dotnet restore test/Integration/AmazonBestSellersExplorer.IntegrationTests/AmazonBestSellersExplorer.IntegrationTests.csproj

      - name: Build backend and tests
        run: |
          dotnet build src/API/AmazonBestSellersExplorer.API/AmazonBestSellersExplorer.API.csproj --configuration Release --no-restore
          dotnet build test/Unit/AmazonBestSellersExplorer.UnitTests/AmazonBestSellersExplorer.UnitTests.csproj --configuration Release --no-restore
          dotnet build test/Integration/AmazonBestSellersExplorer.IntegrationTests/AmazonBestSellersExplorer.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test test/Unit/AmazonBestSellersExplorer.UnitTests/AmazonBestSellersExplorer.UnitTests.csproj --configuration Release --no-build

      # Integration tests are intentionally not executed in GitHub Actions yet.
      # They currently depend on SQL Server LocalDB, which is a local Windows-specific dependency
      # and is not a reliable target for GitHub-hosted ubuntu runners.
      # Revisit this step after moving integration tests to a CI-friendly database strategy
      # such as a SQL Server container or Testcontainers.

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Web/AmazonBestSellersExplorer.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/AmazonBestSellersExplorer.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
